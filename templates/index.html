<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flashcard Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <h1>📚 AI Flashcard Generator</h1>
      <div class="top-bar-actions">
        <button id="progressBtn" class="theme-toggle-btn">📊 Progress</button>
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle dark mode">🌙 Dark</button>
      </div>
    </div>
    <p class="subtitle">Paste your notes, or upload a .txt, PDF, or picture of your notes.</p>

    <div class="history-bar" id="historyBar" style="display:none;">
      <div class="history-header">
        <span>🕘 Recent flashcard sets</span>
        <button id="clearHistoryBtn" class="text-link-btn">Clear all</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>

    <textarea id="notesInput" placeholder="Paste your notes here... (e.g. your database systems or networking notes)"></textarea>

    <div class="upload-row">
      <label for="fileInput" class="file-label">
        📎 Choose a file (.txt, .pdf, image, or a saved .json set)
      </label>
      <input type="file" id="fileInput" accept=".txt,.pdf,.json,image/png,image/jpeg,image/webp,image/gif">
      <span id="fileName" class="file-name"></span>
    </div>

    <button id="generateBtn">Generate Flashcards</button>

    <div class="mode-row" id="modeRow" style="display:none;">
      <button id="flipModeBtn" class="secondary-btn">🔄 Show Meaning First</button>
      <button id="studyModeBtn" class="secondary-btn">🎓 Study Mode</button>
      <button id="quizModeBtn" class="secondary-btn">🧠 Quiz Mode</button>
      <button id="saveBtn" class="secondary-btn">💾 Save Flashcards</button>
    </div>

    <div class="search-row" id="searchRow" style="display:none;">
      <input type="text" id="searchInput" placeholder="🔍 Search this set...">
    </div>

    <p id="statusMsg"></p>

    <div id="flashcardArea"></div>
  </div>

  <!-- Study Mode overlay -->
  <div id="studyOverlay" class="study-overlay" style="display:none;">
    <div class="study-panel">
      <button id="studyCloseBtn" class="study-close-btn" title="Close (Esc)">✕</button>

      <div class="study-top-row">
        <span id="studyProgress" class="study-progress"></span>
        <label class="study-filter-label">
          <input type="checkbox" id="unlearnedOnlyToggle">
          Show unlearned only
        </label>
      </div>

      <div class="study-card" id="studyCard">
        <div class="study-card-inner" id="studyCardInner">
          <div class="study-card-front" id="studyCardFront"></div>
          <div class="study-card-back" id="studyCardBack"></div>
        </div>
      </div>

      <p class="study-hint">Click card or press Space to flip · ← → to navigate</p>

      <div class="study-controls">
        <button id="studyPrevBtn" class="secondary-btn">← Prev</button>
        <button id="studyShuffleBtn" class="secondary-btn">🔀 Shuffle</button>
        <button id="studyNextBtn" class="secondary-btn">Next →</button>
      </div>

      <div class="study-mark-row">
        <button id="studyLearningBtn" class="mark-btn mark-learning">↻ Still Learning</button>
        <button id="studyKnownBtn" class="mark-btn mark-known">✓ Knew It</button>
      </div>
    </div>
  </div>

  <!-- Quiz Mode overlay -->
  <div id="quizOverlay" class="study-overlay" style="display:none;">
    <div class="study-panel">
      <button id="quizCloseBtn" class="study-close-btn" title="Close">✕</button>

      <!-- Setup screen: choose timer before starting -->
      <div id="quizSetup" class="quiz-setup">
        <h3 class="quiz-setup-title">🧠 Quiz Setup</h3>
        <p class="quiz-setup-label">Time per question:</p>
        <div class="timer-option-row">
          <button class="timer-option-btn active" data-seconds="0">No timer</button>
          <button class="timer-option-btn" data-seconds="10">10s</button>
          <button class="timer-option-btn" data-seconds="15">15s</button>
          <button class="timer-option-btn" data-seconds="30">30s</button>
          <button class="timer-option-btn" data-seconds="60">60s</button>
        </div>
        <button id="quizStartBtn" class="secondary-btn" style="margin-top:20px;">Start Quiz →</button>
      </div>

      <!-- Quiz questions (hidden until Start is pressed) -->
      <div id="quizPlay" style="display:none;">
        <div class="study-top-row">
          <span id="quizProgress" class="study-progress"></span>
          <span id="quizTimer" class="quiz-timer"></span>
          <span id="quizScoreLabel" class="study-progress"></span>
        </div>

        <p id="quizQuestion" class="quiz-question"></p>

        <div id="quizOptions" class="quiz-options"></div>

        <p id="quizFeedback" class="quiz-feedback"></p>

        <div class="study-controls">
          <button id="quizNextBtn" class="secondary-btn" style="display:none;">Next Question →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Progress overlay -->
  <div id="progressOverlay" class="study-overlay" style="display:none;">
    <div class="study-panel">
      <button id="progressCloseBtn" class="study-close-btn" title="Close">✕</button>

      <div class="study-top-row">
        <h3 class="quiz-setup-title" style="margin:0;">📊 My Progress</h3>
        <button id="clearProgressBtn" class="text-link-btn">Clear all</button>
      </div>

      <div id="progressList" class="progress-list"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}?v=3"></script>
</body>
</html>
